<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <h1>Expense &amp; Budget Visualizer</h1>
      <button id="theme-toggle" class="icon-btn" type="button" aria-label="Ganti tema">🌙</button>
    </header>

    <!-- Total Balance -->
    <section class="card balance-card">
      <p class="label">TOTAL BALANCE</p>
      <h2 id="total-balance" class="balance">$0.00</h2>
      <p id="limit-warning" class="warning hidden"></p>
    </section>

    <!-- Input Form -->
    <section class="card">
      <h3>Add Transaction</h3>
      <form id="transaction-form" novalidate>
        <label for="item-name">Item Name</label>
        <input type="text" id="item-name" placeholder="Contoh: Nasi goreng" maxlength="100">

        <label for="amount">Amount</label>
        <input type="number" id="amount" placeholder="0" min="0" step="1">

        <label for="category">Category</label>
        <select id="category">
          <option value="">-- Pilih kategori --</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Fun">Fun</option>
        </select>

        <p id="form-error" class="error hidden"></p>
        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>

      <hr>
      <label for="limit-input">Spending Limit (opsional)</label>
      <input type="number" id="limit-input" placeholder="Contoh: 5000" min="0" step="0.01">
    </section>

    <div class="grid">
      <!-- Transaction List -->
      <section class="card">
        <div class="list-header">
          <h3>Transactions</h3>
          <select id="sort-select" aria-label="Urutkan transaksi">
            <option value="newest">Terbaru</option>
            <option value="amount-desc">Amount: Tertinggi</option>
            <option value="amount-asc">Amount: Terendah</option>
            <option value="category">Kategori (A-Z)</option>
          </select>
        </div>
        <ul id="transaction-list" class="transaction-list"></ul>
        <p id="empty-message" class="empty">Belum ada transaksi.</p>
      </section>

      <!-- Chart -->
      <section class="card">
        <h3>Spending by Category</h3>
        <div class="chart-wrap">
          <canvas id="spending-chart"></canvas>
        </div>
      </section>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
